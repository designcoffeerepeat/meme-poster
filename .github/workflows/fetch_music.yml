name: Fetch music
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - run: python3 _tools/fetch_music_browser.py _tools/music_list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok_music
          path: tiktok_music.zip
          retention-days: 7
      - name: Put the zip on a temporary branch
        run: |
          mkdir /tmp/z && cp tiktok_music.zip /tmp/z/ && cd /tmp/z
          git init -q -b music-zip && git add tiktok_music.zip
          git -c user.name=meme-poster -c user.email=meme-poster@users.noreply.github.com commit -qm "music zip"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" music-zip
